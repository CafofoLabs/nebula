[project]
name = "nebula-tooling"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "copier>=9.10,<10", "pre-commit>=4,<5", "git-cliff==2.14.2",
  "sphinx>=8,<9", "myst-parser>=4,<5", "sphinx-rtd-theme>=3,<4",
  "pytest>=8,<10", "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nebula"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
